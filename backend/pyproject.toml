[project]
name = "docu-sign-backend"
version = "0.1.0"
description = "FastAPI backend for Document Signature SaaS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt",
    "python-multipart",
    "email-validator",
    "apscheduler",
    "pymupdf",
    "reportlab",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "black",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
