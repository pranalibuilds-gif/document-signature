version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: docusign_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pranali25}
      POSTGRES_DB: ${POSTGRES_DB:-docu_sign_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: docusign_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage:/app/storage
    environment:
      POSTGRES_SERVER: db
      # Overriding env file host to point to internal docker service
    restart: unless-stopped

volumes:
  postgres_data:
