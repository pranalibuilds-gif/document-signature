name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: docu_sign_db_test
        ports:
          - 5432:5432
        # Wait until postgres is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      ENVIRONMENT: testing
      SECRET_KEY: "ci-test-secret-key-must-be-long-enough-32-chars"
      POSTGRES_SERVER: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: docu_sign_db_test
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx alembic .

      - name: Run Ruff Check
        run: ruff check .

      - name: Run Alembic Migrations
        run: alembic upgrade head

      - name: Verify Application Import
        run: python -c "from app.main import app; print('App imported successfully')"

      - name: Run Tests
        run: pytest
